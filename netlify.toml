# Netlify config for the React frontend. See DEPLOYMENT.md.
# Also set VITE_API_URL in Netlify (Site configuration -> Environment variables) to the Render
# backend's address, e.g. https://bank-data-api.onrender.com  (no trailing slash). Vite bakes it
# into the build, so change it and redeploy if the backend address ever changes.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app uses client-side routing (/portfolio, /login ...): any path must serve index.html,
# otherwise refreshing or opening a deep link gives a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
